<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sürpriz! 🎁</title>
    <style>
        body { font-family: sans-serif; background-color: #fff0f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; margin: 0; }
        .heart { position: absolute; color: #ff85a1; font-size: 20px; opacity: 0.5; pointer-events: none; animation: float linear infinite; z-index: 1; }
        @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }
        .container { background-color: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; z-index: 10; }
        #yesBtn { background-color: #58b970; color: white; padding: 15px 40px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 18px; }
        #noBtn { background-color: #ef476f; color: white; padding: 15px 40px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 18px; position: relative; }
    </style>
</head>
<body>

    <div id="creatorPanel" class="container">
        <h1>✨ Sürprizini Hazırla</h1>
        <input type="text" id="tName" placeholder="İsim" style="width:100%; padding:10px; margin-bottom:10px;"><br>
        <input type="text" id="tQues" value="Benimle konsere gelir misin? 🎸" style="width:100%; padding:10px; margin-bottom:10px;"><br>
        <input type="text" id="tAns" value="Çok mutlu ettin beni! 💕" style="width:100%; padding:10px; margin-bottom:10px;"><br>
        <button id="genBtn" style="background:#ff4d6d; color:white; border:none; padding:10px; width:100%; border-radius:10px;">Linki Oluştur</button>
        <p id="finalLink" style="word-break: break-all; margin-top:10px; color:#d62828;"></p>
    </div>

    <div id="surprisePanel" class="container" style="display: none;">
        <h1 id="qDisplay"></h1>
        <div style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
            <button id="yesBtn">Evet</button>
            <button id="noBtn">Hayır</button>
        </div>
    </div>

    <script>
        function createHeart() {
            const h = document.createElement('div'); h.classList.add('heart'); h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(h); setTimeout(() => h.remove(), 6000);
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('isim')) {
            document.getElementById('creatorPanel').style.display = 'none';
            document.getElementById('surprisePanel').style.display = 'block';
            document.getElementById('qDisplay').innerText = `${decodeURIComponent(params.get('isim'))}, ${decodeURIComponent(params.get('soru'))}`;
        }

        document.getElementById('genBtn').onclick = () => {
            const link = `${window.location.origin}${window.location.pathname}?isim=${encodeURIComponent(document.getElementById('tName').value)}&soru=${encodeURIComponent(document.getElementById('tQues').value)}&cevap=${encodeURIComponent(document.getElementById('tAns').value)}`;
            document.getElementById('finalLink').innerText = link;
        };

        document.getElementById('yesBtn').onclick = () => {
            document.getElementById('surprisePanel').innerHTML = `
                <img src="https://i.imgur.com/8QzQY9S.png" style="width:150px; margin-bottom:20px;">
                <h1 style="font-size:28px;">${decodeURIComponent(params.get('cevap'))}</h1>
            `;
            setInterval(createHeart, 100); // Daha fazla kalp yağmuru
        };

        const noBtn = document.getElementById('noBtn');
        noBtn.onmouseover = () => {
            noBtn.style.position = 'fixed';
            noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            noBtn.style.left = Math.random() * (window.innerWidth - 150) + 'px';
        };
    </script>
</body>
</html>
